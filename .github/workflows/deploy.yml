name: Deploy Tech Archive to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Each job opts into only the token permissions it needs.
permissions: {}

concurrency:
  group: cloudflare-workers
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate article index
        run: node scripts/build-article-index.mjs

      - name: Deploy static assets
        # Pinned so a Wrangler release cannot change deploy behavior unannounced.
        run: npx --yes wrangler@4.137.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
